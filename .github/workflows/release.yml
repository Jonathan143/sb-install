name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有版本标签，例如 v1.0.1 或 v1.1.0-beta.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and branch
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          source scripts/release.sh
          version=$(sed -n 's/^SB_VERSION="\([^"]*\)"$/\1/p' sb.sh)
          valid_version "$version" || { echo 'Invalid SB_VERSION'; exit 1; }
          [[ "$TAG" == "v$version" ]] || { echo 'Tag does not match SB_VERSION'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
      - name: Run checks
        run: bash scripts/check.sh
      - name: Prepare release assets
        run: |
          bash scripts/build.sh
          cd dist
          sha256sum sb.sh > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          source scripts/release.sh
          publish_release "$TAG" dist/sb.sh dist/SHA256SUMS
